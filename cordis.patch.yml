# @snow-the/dsh-bundle-research — 研究事實層：實驗台、知識圖、書庫、ACP 記憶
#
# 聚合包：只插入成員的 row，不搬移任何程式碼。成員仍是獨立套件，可單獨安裝。
# 三條規則（實測自官方 dsh-base）：後寫的 patch 以 id 覆蓋前面的；patch 取代整個
# config 而非合併；row 順序沒有載入語意。
#
# 因此 profile 的 dsh.profile.bundles 只能列這個聚合包，不能同時列成員
# （同一個 id 被兩層宣告時，後者會靜默勝出）。
- insert:
    - id: dsh-research-lab
      name: "@snow-the/dsh-research-lab"
    - id: dsh-alexlib
      name: '@snow-the/dsh-alexlib'
    # notemap 與 acp-memory 已於 2026-11-08 併入 @snow-the/dsh-memory（見 dsh-bundle-core）。
    # 兩者仍是獨立套件、仍在磁碟上，資料也已遷移；要回滾就把它們的 row 加回來。